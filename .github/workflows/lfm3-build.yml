name: LFM3 build

# Builds wllama + wllama-compat against llama.cpp b11960 (first tag with the
# `lfm3` architecture, ggml-org/llama.cpp#31252), runs the upstream browser
# test suite plus an LFM3-1.7B end-to-end test, and publishes the two npm
# tarballs with their sha256 so a consumer can pin the exact bytes.

on:
  push:
    branches:
      - lfm3

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          # build_worker.sh counts llama.cpp commits for LIBLLAMA_VERSION
          fetch-depth: 0
          persist-credentials: false

      - name: Record pins
        run: |
          echo "wllama   $(git rev-parse HEAD)"
          echo "llama.cpp $(git rev-parse HEAD:llama.cpp) ($(cd llama.cpp && git describe --tags --always))"
          (cd llama.cpp && grep -c '"lfm3"' src/llama-arch.cpp)

      # emscripten wasm64: INT64_C(1) is a `long` literal but int64_t is `long long`,
      # so std::max({int64_t, INT64_C(..)}) has mixed types (src/models/deepseek41.cpp).
      # Native Linux has both as `long`, so upstream never sees it. Same value, explicit type.
      - name: Patch llama.cpp INT64_C for wasm64
        run: |
          grep -rl 'INT64_C(' llama.cpp/src | tee /dev/stderr | xargs -r sed -i -E 's/\bINT64_C\(([^()]*)\)/int64_t(\1)/g'
          ! grep -rn '\bINT64_C(' llama.cpp/src
          (cd llama.cpp && git diff --stat)

      - name: Build wasm (main + compat)
        run: |
          set -o pipefail
          ./scripts/build_wasm.sh 2>&1 | tee build-wasm.log || {
            # job logs need auth to read; annotations don't, so surface errors there
            grep -E 'error:|CMake Error|undefined symbol|failed' build-wasm.log | head -20 | while IFS= read -r l; do
              echo "::error::${l:0:900}"
            done
            tail -5 build-wasm.log | while IFS= read -r l; do echo "::error::tail: ${l:0:900}"; done
            exit 1
          }

      - name: Wasm outputs exist
        run: |
          test -s src/wasm/wllama.wasm
          test -s src/wasm/wllama.js
          test -s compat/wasm/wllama.wasm
          test -s compat/wasm/wllama.js
          grep -c -a 'lfm3' src/wasm/wllama.wasm
          grep -c -a 'lfm3' compat/wasm/wllama.wasm
          docker image inspect --format '{{.Id}} {{.RepoTags}}' emscripten/emsdk:4.0.20 || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --include=dev

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Upstream test suite (Chromium)
        run: npx vitest run

      - name: LFM3-1.7B end to end (Chromium)
        run: |
          set -o pipefail
          LFM3_TEST=1 npx vitest run src/lfm3.test.ts --reporter=default --reporter=github-actions 2>&1 | tee lfm3-test.log || {
            grep -E 'Error|error|FAIL|expected|\[lfm3\]|Assertion|abort|wllama' lfm3-test.log | head -25 | while IFS= read -r l; do
              echo "::error::${l:0:900}"
            done
            exit 1
          }

      - name: Pack
        run: |
          mkdir -p out
          npm pack --pack-destination out
          (cd compat && npm pack --pack-destination ../out)
          cp src/wasm/wllama.wasm out/wllama.wasm
          cp compat/wasm/wllama.wasm out/compat-wllama.wasm
          cp compat/wasm/wllama.js out/compat-wllama.js
          for t in out/*.tgz; do echo "== $t"; tar tzvf "$t" | grep -E 'wasm|package.json'; done
          (cd out && sha256sum * | tee SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: wllama-lfm3
          path: out/
          retention-days: 90
